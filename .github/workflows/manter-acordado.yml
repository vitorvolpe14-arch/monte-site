# Mantém o servidor da MONTÊ acordado no plano grátis do Render.
# O Render desliga o serviço depois de 15 minutos sem visitas, e a primeira visita
# depois disso demora até 1 minuto (o Google desiste de ler o sitemap e clientes esperam).
# Esta tarefa acessa a loja a cada 5 minutos para ele não dormir. Um serviço ligado
# o mês todo usa ~744 h, dentro das 750 h grátis do Render.
# Para desligar: apague este arquivo ou desative o workflow na aba Actions do GitHub.
name: Manter loja acordada

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: manter-acordado
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Acessar a loja
        run: |
          # robots.txt é gerado pelo servidor e não consulta o banco: acorda o serviço sem custo.
          for url in https://oficialmontee.com.br/robots.txt https://monte-site-itjk.onrender.com/robots.txt; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 5 "$url" || echo 000)
            echo "$url -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
          done
          echo "::warning::A loja não respondeu 200."
