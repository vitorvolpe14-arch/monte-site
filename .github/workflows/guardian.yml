name: Guardião da loja

# Varredura sem IA a cada 5 minutos (o GitHub pode atrasar um pouco em horário de pico).
# Se a loja falhar, abre UM aviso (issue) marcando o dono, e fecha sozinho quando ela voltar.
# Para testar na hora: Actions > Guardião da loja > Run workflow.
# Para testar o ALERTA: no mesmo botão, preencha "url" com um endereço falso, por exemplo
# https://naoexiste.invalid. O aviso de teste fecha sozinho na próxima varredura normal.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Só para testar o alerta: endereço falso (ex.: https://naoexiste.invalid). Vazio = a loja de verdade."
        required: false
        default: ""

# O aviso é uma issue: o token só precisa criar, comentar e fechar issues.
permissions:
  contents: read
  issues: write

# Uma varredura por vez; se a anterior ainda estiver rodando, a nova espera.
concurrency:
  group: guardian
  cancel-in-progress: false

jobs:
  sweep:
    name: Varredura da loja
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # continue-on-error: a falha da loja não derruba a execução; quem avisa é a issue.
      - name: Varredura
        id: sweep
        continue-on-error: true
        env:
          # Vazio nas execuções normais; o script então usa o endereço da loja.
          GUARDIAN_BASE_URL: ${{ inputs.url }}
        run: node scripts/guardian.mjs

      - name: Abrir ou fechar o aviso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.sweep.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          TEST_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          label="guardiao"
          gh label create "$label" --color D93F0B --description "Alerta automático da varredura da loja" --force >/dev/null
          open="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"

          if [ "$RESULT" = "failure" ]; then
            if [ -n "$open" ]; then
              echo "O aviso #$open já está aberto; nada a fazer."
              exit 0
            fi
            title="Loja MONTÊ com problema"
            intro="a varredura encontrou problema na loja."
            fix="Para corrigir: abra o Claude e diga \"a loja da MONTÊ está com problema, veja este aviso\"."
            if [ -n "${TEST_URL:-}" ]; then
              title="TESTE do alerta: loja MONTÊ com problema"
              intro="este é um TESTE do alerta (endereço falso: $TEST_URL). A loja está bem."
              fix="Nada a fazer: este aviso fecha sozinho na próxima varredura normal."
            fi
            {
              echo "@$OWNER $intro"
              echo
              if [ -f guardian-report.md ]; then
                cat guardian-report.md
              else
                echo "O script da varredura não gerou relatório (provável erro no próprio script)."
              fi
              echo
              echo "Execução: $RUN_URL"
              echo
              echo "$fix"
            } > issue-body.md
            gh issue create --title "$title" --label "$label" --body-file issue-body.md
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "A loja voltou ao normal. Execução: $RUN_URL"
            gh issue close "$open"
          fi
