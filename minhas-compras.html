<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=1" sizes="32x32"><link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<meta name="description" content="Consulte seus pedidos e acompanhe sua entrega MONTÊ">
<meta name="robots" content="noindex">
<title>MONTÊ — Minhas Compras</title>
<link rel="stylesheet" href="style.css?v=20261007-seguranca">
</head>
<body>
<header class="header">
    <a href="/" class="logo">MONTÊ</a>
    <div class="header-actions">
        <a href="/" class="header-purchases-link">VOLTAR À LOJA</a>
    </div>
</header>

<main class="purchases-page">
    <div class="purchases-intro">
        <p class="section-label">MONTÊ</p>
        <h1>Minhas Compras</h1>
        <p>Consulte o status do seu pedido e acompanhe a entrega.</p>
    </div>

    <form id="purchaseLookup" class="purchase-lookup">
        <label>
            Número do pedido
            <input id="purchaseOrder" type="text" placeholder="Ex.: 0007" autocomplete="off" required>
        </label>
        <label>
            E-mail usado na compra
            <input id="purchaseEmail" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
        </label>
        <button type="submit">CONSULTAR PEDIDO</button>
        <p id="purchaseError" class="purchase-error"></p>
    </form>

    <section id="purchaseResult" class="purchase-result" hidden></section>
</main>

<script src="safe-html.js?v=20261007-seguranca"></script>
<script src="minhas-compras.js?v=20261007-seguranca"></script>
</body>
</html>
