<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=1" sizes="32x32"><link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<title>Pedido — MONTÊ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f7f5;color:#111;font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{width:min(720px,100%);background:#fff;padding:42px;border:1px solid #e7e4df}
.logo{text-align:center;letter-spacing:6px;font-size:25px;font-weight:700;margin-bottom:38px}
.check{width:54px;height:54px;border:1px solid #111;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;font-size:25px}
h1{text-align:center;font-size:29px;font-weight:500;margin:0 0 10px}
.subtitle{text-align:center;color:#666;line-height:1.6;margin:0 auto 30px}
.order{background:#f7f5f2;padding:20px;margin:24px 0}
.row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid #e4e1dc}
.row:last-child{border-bottom:0}
.label{color:#666}.value{font-weight:600;text-align:right}
.items{margin:28px 0}.item{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid #eee}
.item-name{font-weight:500}.item-meta{color:#777;font-size:13px;margin-top:5px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;padding-top:20px}
.back{display:block;text-align:center;color:#555;text-decoration:none;margin-top:24px}
.error{text-align:center;color:#555;line-height:1.6}
@media(max-width:600px){.card{padding:28px 18px}.page{padding:16px 10px}h1{font-size:25px}.item{font-size:14px}}
</style>
</head>
<body>
<main class="page"><section class="card">
<div class="logo">MONTÊ</div>
<div id="content"><div class="check">✓</div><h1 id="title">Pedido recebido</h1><p class="subtitle" id="subtitle">Estamos carregando os detalhes do seu pedido.</p>
<div id="orderBox" class="order">Carregando pedido...</div><div id="items" class="items"></div><a class="back" href="/">Voltar para a MONTÊ</a></div>
</section></main>
<script>
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v||0));
const params=new URLSearchParams(location.search);
const orderNsu=params.get("order_nsu");
let lastOrder=null;
let pollTimer=null;
let pollCount=0;

async function fetchOrder(){
  if(!orderNsu) throw new Error("Não foi possível localizar o pedido.");
  const r=await fetch("/api/pedido-confirmacao?order_nsu="+encodeURIComponent(orderNsu),{cache:"no-store"});
  const d=await r.json();
  if(!r.ok||!d.success) throw new Error(d.message||"Pedido não encontrado.");
  return d.order;
}

function isPaid(o){
  return ["paid","processing","shipped","delivered"].includes(o.status);
}

function renderOrder(o){
  lastOrder=o;
  const paid=isPaid(o);

  document.getElementById("title").textContent=paid
    ?"Pagamento recebido"
    :"Pagamento em processamento";

  document.getElementById("subtitle").textContent=paid
    ?"Pagamento confirmado. Recebemos seu pagamento e seu pedido está registrado na MONTÊ."
    :"Seu pedido foi criado e estamos aguardando a confirmação do pagamento pela InfinitePay. Você receberá um e-mail assim que ele for confirmado.";

  document.getElementById("orderBox").innerHTML=
    '<div class="row"><span class="label">Pedido</span><span class="value">'+esc(o.order_code)+'</span></div>'+
    '<div class="row"><span class="label">Status</span><span class="value">'+(paid?"PAGO":"PAGAMENTO PENDENTE")+'</span></div>'+
    '<div class="row"><span class="label">Frete</span><span class="value">'+money(o.shipping)+'</span></div>'+
    '<div class="total"><span>Total</span><span>'+money(o.total)+'</span></div>';

  document.getElementById("items").innerHTML=(o.items||[]).map(i=>
    '<div class="item"><div><div class="item-name">'+esc(i.product_name)+'</div><div class="item-meta">'+
    (i.variant_color?esc(i.variant_color)+" · ":"")+"Qtd. "+i.quantity+
    '</div></div><strong>'+money(i.total_price)+'</strong></div>'
  ).join("");

  if(!paid){
    startPaymentPolling();
  } else {
    stopPolling();
  }
}

async function loadOrder(){
  try{
    const o=await fetchOrder();
    renderOrder(o);
  }catch(e){
    showError(e.message||"Não foi possível carregar o pedido agora.");
  }
}

function startPaymentPolling(){
  if(pollTimer||pollCount>=30)return;
  pollTimer=setInterval(async()=>{
    pollCount++;
    try{
      const o=await fetchOrder();
      renderOrder(o);
      if(isPaid(o)||pollCount>=30)stopPolling();
    }catch(e){
      if(pollCount>=15)stopPolling();
    }
  },2000);
}

function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}

function showError(msg){
  stopPolling();
  document.getElementById("content").innerHTML=
    '<div class="error"><div class="check">!</div><h1>Pedido</h1><p>'+
    esc(msg)+'</p><a class="back" href="/">Voltar para a MONTÊ</a></div>';
}

loadOrder();
</script>
</body></html>
