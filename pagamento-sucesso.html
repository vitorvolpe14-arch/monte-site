<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico?v=1" sizes="32x32"><link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<meta name="robots" content="noindex">
<title>Pedido — MONTÊ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0b0b; --paper:#efe8de; --ivory:#f5efe6; --muted:#a79f95;
  --gold:#c9a45c; --gold-soft:rgba(201,164,92,.34); --wine:#6D2234;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#e4dbcf}
body{
  min-height:100vh; color:var(--ivory); font-family:"DM Sans",Arial,sans-serif;
  background:
    radial-gradient(120% 80% at 50% 0%, #f7f2ea 0%, var(--paper) 55%, #e4dbcf 100%) fixed;
  overflow-x:hidden;
}
/* Fundo em camadas (parallax): monograma e poeira dourada */
.scene{position:relative;min-height:100vh;perspective:1400px}
.backdrop{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.bg-monogram{position:absolute;left:50%;top:50%;width:min(120vw,1100px);margin-left:calc(min(120vw,1100px)/-2);margin-top:calc(min(120vw,1100px)/-2);
  aspect-ratio:1;pointer-events:none;opacity:.5;translate:var(--bx,0px) var(--by,0px);transition:translate .8s cubic-bezier(.2,.7,.2,1)}
.bg-monogram path{fill:none;stroke:rgba(109,34,52,.07);stroke-width:.14}
.dust{position:absolute;inset:-10%;pointer-events:none;translate:var(--dx,0px) var(--dy,0px);transition:translate 1s cubic-bezier(.2,.7,.2,1);
  background:
    radial-gradient(2px 2px at 12% 22%, rgba(201,164,92,.55), transparent 60%),
    radial-gradient(1.5px 1.5px at 78% 14%, rgba(201,164,92,.5), transparent 60%),
    radial-gradient(2px 2px at 88% 62%, rgba(201,164,92,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 22% 78%, rgba(201,164,92,.5), transparent 60%),
    radial-gradient(2.5px 2.5px at 62% 88%, rgba(201,164,92,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 40% 8%, rgba(201,164,92,.45), transparent 60%),
    radial-gradient(2px 2px at 5% 55%, rgba(201,164,92,.4), transparent 60%);
}
.stage{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 18px}

/* A carta */
.letter{
  --rx:0deg; --ry:0deg;
  position:relative;width:min(560px,100%);
  background:
    radial-gradient(90% 60% at 30% 0%, rgba(255,255,255,.06), transparent 60%),
    linear-gradient(180deg,#111 0%,#0b0b0b 55%,#080808 100%);
  box-shadow:0 50px 90px -30px rgba(40,18,10,.55),0 18px 40px -20px rgba(40,18,10,.45);
  transform:rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform .6s cubic-bezier(.2,.7,.2,1);
  animation:letterIn 1.2s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes letterIn{from{opacity:0;transform:translateY(80px) rotateX(14deg)}to{opacity:1}}
.letter-border{position:absolute;inset:14px;border:1px solid var(--gold-soft);pointer-events:none}
.letter-border::before,.letter-border::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--gold)}
.letter-border::before{top:-5px;left:-5px;border-right:0;border-bottom:0}
.letter-border::after{bottom:-5px;right:-5px;border-left:0;border-top:0}
.letter-inner{position:relative;padding:62px 52px 48px;text-align:center}
.layer{translate:calc(var(--px,0)*var(--d,0)*1px) calc(var(--py,0)*var(--d,0)*1px);transition:translate .6s cubic-bezier(.2,.7,.2,1)}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--delay,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.letter-logo{display:block;width:128px;height:auto;margin:0 auto;overflow:visible;filter:drop-shadow(0 0 10px rgba(201,164,92,.18))}
.letter.just-paid .letter-logo{opacity:1;animation:goldFlash 1.4s ease}
@keyframes goldFlash{40%{filter:drop-shadow(0 0 22px rgba(247,231,180,.75))}}
.letter-rule{display:block;width:54px;height:1px;margin:22px auto 20px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.letter-kicker{margin:0 0 16px;font-size:9.5px;letter-spacing:.34em;color:var(--gold)}
.letter-kicker .dot{display:inline-block;width:6px;height:6px;margin-right:9px;border-radius:50%;background:var(--gold);vertical-align:1px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.letter-title{margin:0;font:italic 400 clamp(34px,7vw,46px)/1.05 "Playfair Display",Georgia,serif;letter-spacing:-.02em;color:var(--ivory)}
.letter-text{max-width:400px;margin:18px auto 0;font-size:13.5px;line-height:1.75;color:var(--muted)}
.letter-section{margin-top:34px;text-align:left}
.letter-label{display:block;margin:0 0 12px;font-size:9px;letter-spacing:.3em;color:var(--gold)}
.order-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--gold-soft);border-bottom:1px solid var(--gold-soft)}
.order-meta div{display:grid;gap:5px}
.order-meta span{font-size:8.5px;letter-spacing:.24em;color:var(--muted)}
.order-meta strong{font:400 15px/1.2 "Playfair Display",Georgia,serif;color:var(--ivory)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 0;border-bottom:1px solid rgba(201,164,92,.16)}
.item:last-child{border-bottom:0}
.item-name{font:400 17px/1.25 "Playfair Display",Georgia,serif;color:var(--ivory)}
.item-meta{grid-column:1;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.item-price{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:13px;color:var(--ivory)}
.totals{margin-top:6px;padding-top:14px;border-top:1px solid var(--gold-soft);display:grid;gap:8px}
.totals div{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.totals .grand{margin-top:6px;align-items:baseline;color:var(--ivory)}
.totals .grand span{font-size:9px;letter-spacing:.3em;color:var(--gold)}
.totals .grand strong{font:400 30px/1 "Playfair Display",Georgia,serif;color:var(--gold)}
.letter-sign{margin:40px 0 0;font:italic 400 16px/1.4 "Playfair Display",Georgia,serif;color:var(--muted)}
.letter-sign span{display:block;margin-top:6px;font:normal 400 11px/1 "DM Sans",Arial,sans-serif;letter-spacing:.5em;color:var(--gold);padding-left:.5em}
.letter-actions{margin-top:34px;display:grid;justify-items:center;gap:14px}
.letter-return{appearance:none;cursor:pointer;min-width:240px;padding:16px 28px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:500 10px/1 "DM Sans",Arial,sans-serif;letter-spacing:.32em;transition:background .3s ease,color .3s ease}
.letter-return:hover,.letter-return:focus-visible{background:var(--gold);color:var(--ink);outline:none}
.letter-return:disabled{cursor:default}
.letter-link{font-size:11px;letter-spacing:.08em;color:var(--muted);text-decoration:none;border-bottom:1px solid rgba(167,159,149,.35);padding-bottom:3px}
.letter-link:hover{color:var(--ivory)}
.loading-line{display:block;height:10px;margin:10px 0;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* Fechamento: conteúdo some, a carta dobra em três e recebe o selo */
.letter.is-closing{animation:letterOut .5s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
@keyframes letterOut{to{opacity:0;transform:translateY(12px) scale(.98)}}
.fold-stage{position:fixed;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none}
.fold-stage[hidden]{display:none}
.fold{position:relative;perspective:1600px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.6,0,.2,1),opacity .6s ease;animation:foldIn .5s ease both}
@keyframes foldIn{from{opacity:0;transform:scale(.96)}}
.fold-panel{position:absolute;left:0;right:0;background:linear-gradient(180deg,#121212,#0a0a0a);backface-visibility:visible;box-shadow:inset 0 0 0 1px rgba(201,164,92,.22)}
.fold-panel.top{top:0;transform-origin:50% 100%;z-index:2;transition:transform .75s cubic-bezier(.65,0,.35,1)}
.fold-panel.mid{z-index:1}
.fold-panel.bottom{transform-origin:50% 0;z-index:3;transition:transform .75s cubic-bezier(.65,0,.35,1) .32s}
.fold-panel.bottom::after,.fold-panel.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%);opacity:0;transition:opacity .75s ease}
.fold.is-folded .fold-panel.top{transform:rotateX(-178deg)}
.fold.is-folded .fold-panel.bottom{transform:rotateX(178deg)}
.fold.is-folded .fold-panel::after{opacity:1}
.fold.is-sealed{animation:thud .35s ease}
@keyframes thud{40%{translate:0 4px}}
.fold.is-leaving,.seal-wrap.is-leaving{transform:translateY(-70px) scale(.94);opacity:0}
.seal-wrap{position:absolute;left:50%;top:50%;width:0;height:0;z-index:4;transition:transform .7s cubic-bezier(.6,0,.2,1),opacity .6s ease}
.seal{position:absolute;left:0;top:0;width:92px;height:92px;margin:-46px 0 0 -46px;opacity:0;transform:scale(2.4) rotate(-24deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.seal.is-stamped{animation:stamp .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-8deg)}}
.seal-ring{position:absolute;left:0;top:0;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:1px solid rgba(201,164,92,.6);opacity:0}
.seal-ring.is-on{animation:ring .9s ease-out forwards}
@keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(2.3)}}
.veil{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none;transition:opacity .55s ease}
.veil.is-on{opacity:1}

@media (max-width:600px){
  .stage{padding:28px 12px;align-items:flex-start}
  .letter-inner{padding:52px 24px 40px}
  .letter-border{inset:10px}
  .order-meta{grid-template-columns:1fr 1fr}
  .order-meta div:last-child{grid-column:1 / -1}
  .letter-return{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  .letter,.rise{animation:none;opacity:1}
  .letter,.layer,.bg-monogram,.dust{transition:none;translate:none;transform:none}
  .letter-kicker .dot,.loading-line{animation:none}
}
</style>
</head>

        </svg>
        <span class="letter-rule rise" style="--delay:.65s"></span>
        <p class="letter-kicker layer rise" id="kicker" style="--d:3;--delay:.75s">SEU PEDIDO</p>
        <h1 class="letter-title layer rise" id="title" style="--d:5;--delay:.85s">Um momento…</h1>

<script>
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v||0));
const params=new URLSearchParams(location.search);
const orderNsu=params.get("order_nsu");
const confirmationToken=params.get("confirmation_token");
const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
let lastOrder=null;
let wasPaid=null;
let pollTimer=null;
let pollCount=0;

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}

async function fetchOrder(){
  if(!orderNsu||!confirmationToken) throw new Error("Não foi possível validar a confirmação deste pedido.");
  const r=await fetch("/api/pedido-confirmacao?order_nsu="+encodeURIComponent(orderNsu)+"&confirmation_token="+encodeURIComponent(confirmationToken),{cache:"no-store"});
  const d=await r.json();
  if(!r.ok||!d.success) throw new Error(d.message||"Pedido não encontrado.");
  return d.order;
}

function isPaid(o){
  return ["paid","processing","shipped","delivered"].includes(o.status);
}

function firstName(name){
  const first=String(name||"").trim().split(/\s+/)[0]||"";
  return first ? first.charAt(0).toUpperCase()+first.slice(1).toLowerCase() : "";
}

function formatDate(value){
  const date=value?new Date(value):new Date();
  return isNaN(date)?"—":date.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function renderOrder(o){
  lastOrder=o;
  const paid=isPaid(o);
  const name=firstName(o.customer_name);
  const letter=document.getElementById("letter");

  document.getElementById("kicker").innerHTML=paid
    ? "COMPRA CONFIRMADA"
    : '<span class="dot" aria-hidden="true"></span>PAGAMENTO EM CONFIRMAÇÃO';
  document.getElementById("title").textContent=paid
    ? (name ? "Obrigada, "+name+"." : "Obrigada pela sua compra.")
    : (name ? "Recebemos seu pedido, "+name+"." : "Recebemos seu pedido.");
  document.getElementById("subtitle").textContent=paid
    ? "Sua compra foi confirmada. Cada peça MONTÊ é separada à mão e embalada com cuidado para chegar até você."
    : "Assim que a InfinitePay confirmar o pagamento, esta carta se atualiza sozinha e você recebe um e-mail.";

  const payment=o.payment_method==="pix"?"Pix":o.payment_method==="credit_card"?"Cartão":"—";
  document.getElementById("orderMeta").innerHTML=
    '<div><span>NÚMERO</span><strong>'+esc(o.order_code||"—")+'</strong></div>'+
    '<div><span>DATA</span><strong>'+esc(formatDate(o.created_at))+'</strong></div>'+
    '<div><span>PAGAMENTO</span><strong>'+esc(payment)+(paid?" · pago":" · pendente")+'</strong></div>';

  const items=o.items||[];
  document.getElementById("items").innerHTML=items.length ? items.map(i=>
    '<div class="item"><span class="item-name">'+esc(i.product_name)+'</span>'+
    '<span class="item-price">'+money(i.total_price)+'</span>'+
    '<span class="item-meta">'+(i.variant_color?esc(i.variant_color)+" · ":"")+Number(i.quantity||0)+(Number(i.quantity)===1?" peça":" peças")+'</span></div>'
  ).join("") : '<p class="letter-text" style="margin:0">Itens do pedido indisponíveis no momento.</p>';

  const subtotal=Number(o.subtotal||0), shipping=Number(o.shipping||0), total=Number(o.total||0);
  const discount=Math.round((subtotal+shipping-total)*100)/100;
  document.getElementById("totals").innerHTML=
    (subtotal?'<div><span>Peças</span><span>'+money(subtotal)+'</span></div>':"")+
    (discount>0?'<div><span>Desconto Pix</span><span>-'+money(discount)+'</span></div>':"")+
    '<div><span>Frete</span><span>'+money(shipping)+'</span></div>'+
    '<div class="grand"><span>TOTAL</span><strong>'+money(total)+'</strong></div>';

  if(wasPaid===false && paid){
    letter.classList.remove("just-paid");
    void letter.offsetWidth;
    letter.classList.add("just-paid");
  }
  wasPaid=paid;

  if(!paid) startPaymentPolling(); else stopPolling();
}

function showError(msg){
  stopPolling();
  document.getElementById("kicker").textContent="PEDIDO";
  document.getElementById("title").textContent="Não encontramos seu pedido.";
  document.getElementById("subtitle").textContent=msg+" Se você concluiu o pagamento, confira seu e-mail ou fale com a MONTÊ.";
  document.querySelectorAll(".letter-section").forEach(el=>el.hidden=true);
}

async function loadOrder(){
  try{
    renderOrder(await fetchOrder());
  }catch(e){
    showError(e.message||"Não foi possível carregar o pedido agora.");
  }
}

function startPaymentPolling(){
  if(pollTimer||pollCount>=30)return;
  pollTimer=setInterval(async()=>{
    pollCount++;
    try{
      const o=await fetchOrder();
      renderOrder(o);
      if(isPaid(o)||pollCount>=30)stopPolling();
    }catch(e){
      if(pollCount>=15)stopPolling();
    }
  },2000);
}

function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

/* Parallax: a carta inclina com o ponteiro; camadas internas, monograma e
   poeira dourada se movem em profundidades diferentes. */
(function setupParallax(){
  const letter=document.getElementById("letter");
  const monogram=document.querySelector(".bg-monogram");
  const dust=document.querySelector(".dust");
  window.addEventListener("pointermove",e=>{
    if(reduceMotion.matches||e.pointerType==="touch"||letter.classList.contains("is-closing"))return;
    const x=e.clientX/window.innerWidth-.5, y=e.clientY/window.innerHeight-.5;
    letter.style.setProperty("--ry",(x*7).toFixed(2)+"deg");
    letter.style.setProperty("--rx",(y*-5).toFixed(2)+"deg");
    letter.style.setProperty("--px",(x*2).toFixed(2));
    letter.style.setProperty("--py",(y*2).toFixed(2));
    monogram.style.setProperty("--bx",(x*-40).toFixed(1)+"px");
    monogram.style.setProperty("--by",(y*-30).toFixed(1)+"px");
    dust.style.setProperty("--dx",(x*24).toFixed(1)+"px");
    dust.style.setProperty("--dy",(y*18).toFixed(1)+"px");
  },{passive:true});
  let ticking=false;
  window.addEventListener("scroll",()=>{
    if(ticking||reduceMotion.matches)return;
    ticking=true;
    requestAnimationFrame(()=>{
      ticking=false;
      monogram.style.setProperty("--by",(scrollY*-.25).toFixed(1)+"px");
      dust.style.setProperty("--dy",(scrollY*-.12).toFixed(1)+"px");
    });
  },{passive:true});
})();

/* Retornar ao site: a carta dobra em três, recebe o selo de cera e volta à loja. */
function homeUrl(){
  return /onrender\.com$/i.test(location.hostname) ? "https://oficialmontee.com.br/" : "/";
}

function closeLetter(){
  const button=document.getElementById("returnButton");
  if(button.disabled)return;
  button.disabled=true;
  if(reduceMotion.matches){ location.href=homeUrl(); return; }

  const letter=document.getElementById("letter");
  const stage=document.getElementById("foldStage");
  const fold=document.getElementById("fold");
  const seal=document.getElementById("seal");
  const ring=document.getElementById("sealRing");
  const veil=document.getElementById("veil");
  const rect=letter.getBoundingClientRect();

  letter.classList.add("is-closing");
  ["--rx","--ry","--px","--py"].forEach(n=>letter.style.removeProperty(n));

  // A folha dobrada cabe na tela, com a proporção da carta.
  const width=Math.min(rect.width, window.innerWidth*.9);
  const height=Math.min(rect.height, window.innerHeight*.78, width*1.55);
  fold.style.width=width+"px";
  fold.style.height=height+"px";
  const third=height/3;
  fold.querySelectorAll(".fold-panel").forEach((panel,i)=>{
    panel.style.height=(third+.5)+"px";
    panel.style.top=(i*third)+"px";
  });

  const sealWrap=document.getElementById("sealWrap");
  const at=(ms,fn)=>setTimeout(fn,ms);
  at(250,()=>{ stage.hidden=false; });
  at(820,()=>fold.classList.add("is-folded"));
  at(1950,()=>{
    seal.classList.add("is-stamped");
    at(260,()=>{ ring.classList.add("is-on"); fold.classList.add("is-sealed"); });
  });
  at(3000,()=>{ fold.classList.add("is-leaving"); sealWrap.classList.add("is-leaving"); veil.classList.add("is-on"); });
  at(3650,()=>{ location.href=homeUrl(); });
}

document.getElementById("returnButton").addEventListener("click",closeLetter);
loadOrder();
</script>
